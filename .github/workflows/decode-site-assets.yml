name: Build proper site assets
on:
  push:
    branches: [proper-assets-v2]
    paths:
      - '.asset-b64/READY'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proper-assets-v2
          fetch-depth: 0
      - name: Decode image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          for name in asterion-crew-hero asterion-starship captain-marcus-vale mentor-elena-torres pilot-chase-mercer; do
            cat .asset-b64/${name}.*.b64 | base64 -d > docs/assets/${name}.webp
            file docs/assets/${name}.webp
          done
      - name: Commit proper assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-b64
          rm -f .github/workflows/decode-site-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add proper Rift Signal site assets"
          git push origin HEAD:proper-assets-v2
