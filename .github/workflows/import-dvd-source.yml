name: Import DVD Mission 001 assets
on:
  push:
    branches: [web-first-shift-v0.1]
    paths:
      - '.github/workflows/import-dvd-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-first-shift-v0.1
          fetch-depth: 0
      - name: Download v1.0 source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rift
          gh release download v1.0             --repo bestpolity-llc/rift-signal             --pattern 'RIFT-SIGNAL-Mission-Set-1-v1.0-SOURCE.zip'             --dir /tmp/rift
          unzip -q /tmp/rift/RIFT-SIGNAL-Mission-Set-1-v1.0-SOURCE.zip -d /tmp/rift/extracted
          find /tmp/rift/extracted -maxdepth 3 -type f | head -50
      - name: Import Mission 001 source and web media
        run: |
          ROOT=/tmp/rift/extracted/rift-signal-remaster
          test -f "$ROOT/missions/mission-001/mission.json"
          mkdir -p docs/play/source docs/play/assets/audio docs/play/assets/scenes
          cp "$ROOT/missions/mission-001/mission.json" docs/play/source/
          cp "$ROOT/missions/mission-001/flow.txt" docs/play/source/
          cp "$ROOT/missions/mission-001/script.md" docs/play/source/
          cp "$ROOT/missions/mission-001/voice-cast.json" docs/play/source/
          cp "$ROOT/assets/audio/narration/"*.wav docs/play/assets/audio/
          cp "$ROOT/assets/audio/cues/"*.wav docs/play/assets/audio/
          cp "$ROOT/dvd/menus/"*.jpg docs/play/assets/scenes/
      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/play/source docs/play/assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Import Mission 001 DVD source and media"
          git push origin HEAD:web-first-shift-v0.1
